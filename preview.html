<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Super Smart Racket - AI Monitor</title>

  <style>
    :root {
      font-family: Inter, "Noto Sans TC", Arial, sans-serif;
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #0b1220;
      color: #e8eefc;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
    }

    .sub {
      color: #aab7d1;
      margin-top: 0;
    }

    .card {
      background: #121c2f;
      border: 1px solid #263653;
      border-radius: 14px;
      padding: 22px;
      margin: 16px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #aab7d1;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #344968;
      background: #0c1526;
      color: #fff;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      margin-right: 8px;
    }

    .primary {
      background: #2d7cff;
      color: white;
    }

    .danger {
      background: #d64d5b;
      color: white;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #5a2630;
      color: #ffd7dc;
      font-size: 13px;
    }

    .status.ok {
      background: #184f3a;
      color: #c9ffe9;
    }

    .ai-card {
      text-align: center;
      background: #0c1526;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #263653;
    }

    .value {
      font-size: 38px;
      font-weight: 900;
      margin-top: 12px;
      word-break: break-word;
    }

    .result {
      font-size: 42px;
      font-weight: 900;
      margin-top: 14px;
    }

    .small {
      margin-top: 8px;
      font-size: 16px;
      color: #9ab9ef;
    }

    .bar-bg {
      width: 100%;
      height: 22px;
      background: #08101e;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 18px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #2d7cff;
      transition: width 0.2s ease;
    }

    .bar.forehand {
      background: #42bd89;
    }

    .mono {
      font-family: Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      word-break: break-all;
      background: #08101e;
      padding: 15px;
      border-radius: 8px;
      min-height: 90px;
      max-height: 260px;
      overflow: auto;
      line-height: 1.7;
    }

    .hint {
      font-size: 13px;
      color: #95a4c0;
      line-height: 1.6;
    }
  </style>
</head>


<body>

<div class="wrap">

  <h1>Super Smart Racket</h1>

  <p class="sub">
    HT32F67595 + Edge Impulse BLE 即時動作辨識
  </p>


  <!-- ================= BLE ================= -->

  <div class="card">

    <h2>BLE 連線</h2>

    <div class="grid">

      <div>
        <label>BLE 裝置名稱</label>

        <input
          id="deviceName"
          value="Super_Smart_Racket"
        />
      </div>

      <input
        type="hidden"
        id="serviceUuid"
        value="0000fff0-0000-1000-8000-00805f9b34fb"
      />

      <input
        type="hidden"
        id="charUuid"
        value="0000fff1-0000-1000-8000-00805f9b34fb"
      />

    </div>


    <div style="margin-top:16px;">

      <button
        class="primary"
        id="connectBtn"
      >
        連接藍牙
      </button>

      <button
        class="danger"
        id="disconnectBtn"
      >
        中斷連線
      </button>

      <span
        id="status"
        class="status"
      >
        未連線
      </span>

    </div>


    <p class="hint">
      BLE AI 封包格式：
      <br>
      label0[8] + value0(float32)
      <br>
      label1[8] + value1(float32)
      <br>
      總長度：24 bytes
    </p>

  </div>


  <!-- ================= AI Result ================= -->

  <div class="card">

    <h2>AI 辨識結果</h2>

    <div class="grid">

      <div class="ai-card">

        <label>Backhand 反手</label>

        <div
          class="value"
          id="backhand"
        >
          -
        </div>

        <div class="bar-bg">
          <div
            class="bar"
            id="backhandBar"
          ></div>
        </div>

      </div>


      <div class="ai-card">

        <label>Forehand 正手</label>

        <div
          class="value"
          id="forehand"
        >
          -
        </div>

        <div class="bar-bg">
          <div
            class="bar forehand"
            id="forehandBar"
          ></div>
        </div>

      </div>

    </div>


    <div
      class="ai-card"
      style="margin-top:18px;"
    >

      <label>目前辨識動作</label>

      <div
        class="result"
        id="result"
      >
        等待資料
      </div>

      <div
        class="small"
        id="confidence"
      >
        -
      </div>

    </div>

  </div>


  <!-- ================= BLE Data ================= -->

  <div class="card">

    <h2>BLE 資料</h2>

    <div
      id="raw"
      class="mono"
    >
尚未收到資料
    </div>

  </div>


  <!-- ================= HEX ================= -->

  <div class="card">

    <h2>原始 16 進位資料</h2>

    <div
      id="hex"
      class="mono"
    >
尚未收到資料
    </div>

  </div>


  <!-- ================= LOG ================= -->

  <div class="card">

    <h2>Log</h2>

    <div
      id="log"
      class="mono"
    ></div>

  </div>

</div>


<script>

let bluetoothDevice = null;
let gattServer = null;
let notifyCharacteristic = null;


const $ = (id) =>
  document.getElementById(id);


function log(msg)
{
  const t =
    new Date().toLocaleTimeString();

  $("log").textContent +=
    `[${t}] ${msg}\n`;

  $("log").scrollTop =
    $("log").scrollHeight;
}


function setStatus(text, ok = false)
{
  $("status").textContent = text;

  $("status").className =
    ok
      ? "status ok"
      : "status";
}


function bytesToHex(view)
{
  const arr = [];

  for (let i = 0; i < view.byteLength; i++)
  {
    arr.push(
      view
        .getUint8(i)
        .toString(16)
        .padStart(2, "0")
        .toUpperCase()
    );
  }

  return arr.join(" ");
}


/*
 * 從固定長度 char array 讀 C 字串
 */
function readCString(view, offset, length)
{
  const bytes = [];

  for (let i = 0; i < length; i++)
  {
    const value =
      view.getUint8(offset + i);

    if (value === 0)
    {
      break;
    }

    bytes.push(value);
  }

  return new TextDecoder().decode(
    new Uint8Array(bytes)
  );
}


/*
 * 24-byte packet
 *
 * offset 0~7    label0[8]
 * offset 8~11   value0 float32
 *
 * offset 12~19  label1[8]
 * offset 20~23  value1 float32
 */
function parseAiResult(view)
{
  $("hex").textContent =
    bytesToHex(view);


  /* ================= 狀態封包 ================= */

  if (view.byteLength === 2)
  {
    const b0 = view.getUint8(0);
    const b1 = view.getUint8(1);

    if (b0 === 0xEE)
    {
      if (b1 === 0x01)
      {
        $("raw").textContent =
          "Shared Memory 尚未初始化";

        $("result").textContent =
          "等待 MP 初始化";

        log(
          "Shared Memory 尚未初始化"
        );

        return;
      }

      if (b1 === 0x00)
      {
        $("raw").textContent =
          "Shared Memory 目前沒有資料";

        $("result").textContent =
          "等待 AI 資料";

        log(
          "Shared Memory 目前沒有資料"
        );

        return;
      }
    }
  }


  /* ================= 長度確認 ================= */

  if (view.byteLength < 24)
  {
    $("raw").textContent =
      `資料長度錯誤\n收到：${view.byteLength} bytes\n預期：24 bytes`;

    log(
      `資料長度錯誤：收到 ${view.byteLength} bytes，預期 24 bytes`
    );

    return;
  }


  const littleEndian = true;


  /* ================= Label ================= */

  const label0 =
    readCString(
      view,
      0,
      8
    );

  const label1 =
    readCString(
      view,
      12,
      8
    );


  /* ================= float ================= */

  const value0 =
    view.getFloat32(
      8,
      littleEndian
    );

  const value1 =
    view.getFloat32(
      20,
      littleEndian
    );


  /* ================= 驗證 ================= */

  if (
    !Number.isFinite(value0) ||
    !Number.isFinite(value1)
  )
  {
    $("raw").textContent =
      "收到無效的浮點數資料";

    log(
      "Float 資料解析失敗"
    );

    return;
  }


  /*
   * 你的 label[8] 只夠：
   *
   * "backhan\0"
   * "forehan\0"
   *
   * 所以用 startsWith 判斷
   */
  let backhand = 0.0;
  let forehand = 0.0;


  if (label0.startsWith("backhan"))
  {
    backhand = value0;
  }
  else if (label0.startsWith("forehan"))
  {
    forehand = value0;
  }


  if (label1.startsWith("backhan"))
  {
    backhand = value1;
  }
  else if (label1.startsWith("forehan"))
  {
    forehand = value1;
  }


  /* ================= 百分比 ================= */

  const backhandPercent =
    backhand * 100.0;

  const forehandPercent =
    forehand * 100.0;


  $("backhand").textContent =
    backhandPercent.toFixed(2) + " %";

  $("forehand").textContent =
    forehandPercent.toFixed(2) + " %";


  /* ================= Progress Bar ================= */

  $("backhandBar").style.width =
    Math.max(
      0,
      Math.min(
        100,
        backhandPercent
      )
    ) + "%";


  $("forehandBar").style.width =
    Math.max(
      0,
      Math.min(
        100,
        forehandPercent
      )
    ) + "%";


  /* ================= 判斷類別 ================= */

  let detectedResult;
  let confidence;


  if (backhand > forehand)
  {
    detectedResult =
      "反手 Backhand";

    confidence =
      backhandPercent;
  }
  else if (forehand > backhand)
  {
    detectedResult =
      "正手 Forehand";

    confidence =
      forehandPercent;
  }
  else
  {
    detectedResult =
      "無法判斷";

    confidence =
      backhandPercent;
  }


  $("result").textContent =
    detectedResult;

  $("confidence").textContent =
    `信心值：${confidence.toFixed(2)} %`;


  /* ================= BLE 文字資料 ================= */

  $("raw").textContent =
    `Backhand 反手：${backhandPercent.toFixed(2)} %\n` +
    `Forehand 正手：${forehandPercent.toFixed(2)} %\n\n` +
    `辨識結果：${detectedResult}\n` +
    `信心值：${confidence.toFixed(2)} %`;


  /* ================= LOG ================= */

  log(
    `Backhand=${backhandPercent.toFixed(2)}%, ` +
    `Forehand=${forehandPercent.toFixed(2)}%, ` +
    `結果=${detectedResult}`
  );
}


/*
 * BLE Notify callback
 */
function onNotification(event)
{
  const view =
    event.target.value;

  parseAiResult(view);
}


/*
 * Connect BLE
 */
async function connectBluetooth()
{
  try
  {
    if (!navigator.bluetooth)
    {
      throw new Error(
        "此瀏覽器不支援 Web Bluetooth，請使用 Chrome 或 Edge。"
      );
    }


    const deviceName =
      $("deviceName")
        .value
        .trim();

    const serviceUuid =
      $("serviceUuid")
        .value
        .trim();

    const charUuid =
      $("charUuid")
        .value
        .trim();


    log(
      "開始搜尋 BLE 裝置..."
    );


    bluetoothDevice =
      await navigator.bluetooth.requestDevice(
      {
        filters:
        [
          {
            name: deviceName
          }
        ],

        optionalServices:
        [
          serviceUuid
        ]
      }
      );


    bluetoothDevice.addEventListener(
      "gattserverdisconnected",

      () =>
      {
        setStatus(
          "連線已中斷"
        );

        log(
          "BLE 已中斷"
        );
      }
    );


    log(
      `找到裝置：${bluetoothDevice.name || "Unknown"}`
    );


    gattServer =
      await bluetoothDevice.gatt.connect();


    log(
      "GATT 已連線"
    );


    const service =
      await gattServer.getPrimaryService(
        serviceUuid
      );


    log(
      "取得 BLE Service"
    );


    notifyCharacteristic =
      await service.getCharacteristic(
        charUuid
      );


    log(
      "取得 Notify Characteristic"
    );


    await notifyCharacteristic
      .startNotifications();


    notifyCharacteristic
      .addEventListener(
        "characteristicvaluechanged",
        onNotification
      );


    setStatus(
      `已連線：${bluetoothDevice.name}`,
      true
    );


    log(
      "Notify 已開啟，等待 Edge Impulse AI 結果..."
    );

  }
  catch (err)
  {
    console.error(err);

    setStatus(
      "連線失敗"
    );

    log(
      `錯誤：${err.message}`
    );
  }
}


/*
 * Disconnect BLE
 */
function disconnectBluetooth()
{
  if (notifyCharacteristic)
  {
    notifyCharacteristic
      .removeEventListener(
        "characteristicvaluechanged",
        onNotification
      );
  }


  if (
    bluetoothDevice &&
    bluetoothDevice.gatt.connected
  )
  {
    bluetoothDevice.gatt.disconnect();
  }


  notifyCharacteristic = null;
  gattServer = null;
  bluetoothDevice = null;


  setStatus(
    "未連線"
  );


  $("backhand").textContent =
    "-";

  $("forehand").textContent =
    "-";

  $("result").textContent =
    "等待資料";

  $("confidence").textContent =
    "-";

  $("backhandBar").style.width =
    "0%";

  $("forehandBar").style.width =
    "0%";

  $("raw").textContent =
    "尚未收到資料";

  $("hex").textContent =
    "尚未收到資料";


  log(
    "已手動中斷 BLE"
  );
}


/*
 * Buttons
 */
$("connectBtn").addEventListener(
  "click",
  connectBluetooth
);

$("disconnectBtn").addEventListener(
  "click",
  disconnectBluetooth
);

</script>

</body>
</html>
